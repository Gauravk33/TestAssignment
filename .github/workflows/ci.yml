name: CI Pipeline - TeamSpace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      # Backend API CI
      - name: Install API Dependencies
        working-directory: api
        run: npm ci

      - name: Type Check & Build API
        working-directory: api
        run: npm run build

      - name: Run Automated Test Suite & Coverage
        working-directory: api
        env:
          PORT: 5000
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/teamspace_test
          USE_MEMORY_DB_FALLBACK: "true"
          REDIS_URI: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_key_1234567890
          JWT_REFRESH_SECRET: ci_jwt_refresh_secret_key_0987654321
          CLIENT_URL: http://localhost:5173
        run: npm test

      # Frontend Client CI
      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Type Check & Build Client
        working-directory: client
        run: npm run build
